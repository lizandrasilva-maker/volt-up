<body><div class="wrap" id="app" style="width:420px"></div><pre id="out">rodando</pre>
<script>try{localStorage.clear();sessionStorage.clear()}catch(e){}</script>
<script src="../js/estado.js"></script><script src="../js/rede.js"></script><script src="../js/motor.js"></script><script src="../js/bancada-real.js"></script><script src="../js/multifilar.js"></script><script src="../js/planta.js"></script><script src="../js/conteudo.js"></script><script src="../js/cc.js"></script><script src="../js/lanterna.js"></script><script src="../js/cap1.js"></script><script src="../js/imagens.js"></script><script src="../js/historia.js"></script><script src="../js/telas.js"></script><script src="../js/fases.js"></script><script src="../js/aula.js"></script><script src="../js/carreira.js"></script><script src="../js/calculo.js"></script><script src="../js/calculadora.js"></script><script src="../js/teste.js"></script>
<script>
/* Bancada 3D (MVP): monta a cena com WebGL e faz os mesmos gestos pela 3D (toques no canvas, com raycast)
   e pelo SVG. Os dois caminhos têm de deixar a bancada no mesmo estado. Rode com: node tests/rodar.js */
const R={};
/* cores esperadas: as da tabela CORES do 2D, com var(--x) resolvida pelo CSS */
const coresDoFioCSS=k=>(CORES[k].c.match(/var\(--[\w-]+\)|#[0-9a-f]{3,8}\b/gi)).map(x=>x.startsWith('var(')?getComputedStyle(document.documentElement).getPropertyValue(x.slice(4,-1)).trim():x);
(async()=>{try{
  S.mode='moderado';S.char='aprendiz';S.vista={moderado:'real'};
  VISTA3D.flag=true;VISTA3D.ligada=true;
  await carrega3D();
  R.carregou=!!VISTA3D.vista;R.erro=VISTA3D.erro;
  if(!VISTA3D.vista)throw new Error('a vista 3D não carregou: '+VISTA3D.erro);
  const task=()=>comARede(LAB3D.dados.moderado),D=VISTA3D.vista.debug,J=JSON.stringify;
  const assinatura=st=>J({fios:st.wires.map(w=>w.a+'-'+w.b+':'+w.cor),dj:st.comps.find(c=>c.id==='DJ').trip===true,fonte:st.comps.find(c=>c.type==='src').trip===true});
  const cor=k=>document.querySelector('[data-cor="'+k+'"]').click();
  const verificar=()=>{document.getElementById('chk').click();return (document.querySelector('.fb')||{}).textContent||''};

  R.canvas=!!cv();R.semSvg=!document.querySelector('.bench svg');R.webgl=D.gl();R.malhas=D.contagem();

  const toque=id=>{const p=typeof id==='number'?D.telaFio(id):D.tela(id);pe('pointerdown',p,cv());pe('pointerup',p)};
  const arrasta=(a,b)=>{const p=D.tela(a),q=D.tela(b);pe('pointerdown',p,cv());pe('pointermove',{x:(p.x+q.x)/2,y:(p.y+q.y)/2+20});pe('pointermove',q);pe('pointerup',q)};

  toque('B.0');toque('DJ.0');                   /* fase: fonte → disjuntor (toque-toque) */
  arrasta('DJ.1','L1.0');                        /* fase: disjuntor → lâmpada (arrastando o fio) */
  cor('neutro');toque('L1.1');toque('B.1');      /* neutro: lâmpada → fonte */
  R.corFase=J(D.corFio(0))===J(coresDoFioCSS('fase'));R.corNeutro=J(D.corFio(2))===J(coresDoFioCSS('neutro'));

  R.fios3d=D.fios();R.acesa=D.brilho('L1')>0.5;
  {const f=D.faixa();R.faixaOn=f.estado==='on'&&f.pontos>0&&f.cabos===3&&f.altura>0&&J(f.legendas)===J(['Trafo 13,8 kV→'+rede().V+' V','Medidor kWh','Quadro + DJ',rede().V+' V~ · '+rede().Hz+' Hz'])&&!document.querySelector('.benchwrap .entrada')}
  toque('DJ');R.djDesligou=BANCADA.st.comps.find(c=>c.id==='DJ').trip===true&&D.alavanca('DJ')>0;R.apagou=D.brilho('L1')<0.05;R.faixaOff=D.faixa().estado===''&&D.faixa().pontos===0;
  toque('DJ');R.religou=D.brilho('L1')>0.5&&D.alavanca('DJ')<0;
  cor('fase');toque('DJ.1');toque('B.1');        /* curto depois do disjuntor: o DJ desarma */

  R.aprovou3d=/aprovado/i.test(verificar());
  const st3d=assinatura(BANCADA.st);

  /* ---- SVG, mesmos gestos ---- */
  VISTA3D.ligada=false;runBuild(LAB3D,task());
  const svg=()=>document.querySelector('.bench svg');

  const aciona=id=>svg().querySelector('[data-sw="'+id+'"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));
  tap('B.0');tap('DJ.0');tap('DJ.1');tap('L1.0');cor('neutro');tap('L1.1');tap('B.1');
  aciona('DJ');aciona('DJ');cor('fase');tap('DJ.1');tap('B.1');
  svg().querySelector('[data-w="3"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));aciona('DJ');

  const stSvg=assinatura(BANCADA.st);
  R.equivalente=st3d===stSvg;R.st3d=st3d;R.stSvg=stSvg;
  /* ---- DR na Quadro Novo (Cap. 2, nível Leve): a mesma fase em 3D e no SVG ---- */
  {S.mode='leve';const pq=phaseById('quadronovo'),tq=()=>comARede(pq.dados.leve),dr=()=>BANCADA.st.comps.find(c=>c.id==='DR');
   const sig=st=>J({fios:st.wires.map(w=>w.a+'-'+w.b+':'+w.cor),dr:st.comps.find(c=>c.id==='DR').trip===true,dg:st.comps.find(c=>c.id==='DG').trip===true});
   const fb=()=>(document.querySelector('.fb')||{}).textContent||'';
   VISTA3D.ligada=true;runBuild(pq,tq());const q=R.quadro={};

   q.acesa=D.brilho('L1')>0.5&&D.visorDR('DR')==='armado';

   {const p=D.telaTeste('DR');pe('pointerdown',p,cv());pe('pointerup',p)}
   q.teste=dr().trip===true&&D.alavanca('DR')>0&&D.visorDR('DR')==='desarmado'&&D.brilho('L1')<0.05;
   {const p=D.telaTeste('DR');pe('pointerdown',p,cv());pe('pointerup',p)}q.testeNaoRearma=dr().trip===true;
   toque('DR');q.rearmou=dr().trip===false&&D.alavanca('DR')<0&&D.brilho('L1')>0.5;
   /* fuga: o neutro da lâmpada volta por fora do DR e ele desarma sozinho (regra do solver) */
   toque('L1.1');toque('B.1');q.fuga=dr().trip===true&&dr().porFuga===true&&D.visorDR('DR')==='desarmado';
   toque(5);toque('DR');q.semFuga=dr().trip===false&&BANCADA.st.wires.length===5;
   q.aprovou3d=/aprovado/i.test(verificar());const s3=sig(BANCADA.st);
   VISTA3D.ligada=false;runBuild(pq,tq());
   const tap=t=>{svg().querySelector('[data-t="'+t+'"]').dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));window.dispatchEvent(new PointerEvent('pointerup'))};
   const aciona=id=>svg().querySelector('[data-sw="'+id+'"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));
   cor('fase');tap('B.0');tap('DG.0');tap('DG.1');tap('DR.0');tap('DR.2');tap('L1.0');
   cor('neutro');tap('B.1');tap('DR.1');tap('DR.3');tap('L1.1');
   aciona('DR');aciona('DR');tap('L1.1');tap('B.1');
   svg().querySelector('[data-w="5"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));aciona('DR');
   q.aprovouSvg=/aprovado/i.test(verificar());q.equivalente=s3===sig(BANCADA.st);q.s3=s3;q.ss=sig(BANCADA.st);}
  /* ---- Botoeiras 3D (BL liga NA, BD desliga NF) e legibilidade dos bornes ---- */
  {S.mode='moderado';const bt=R.botoeiras={},tb=()=>comARede(LAB3D_BOT.dados.moderado),espera=ms=>new Promise(r=>setTimeout(r,ms));
   const sig=st=>J({fios:st.wires.map(w=>w.a+'-'+w.b+':'+w.cor),apertadas:st.comps.filter(c=>c.type==='btn').map(c=>!!c.pressed)});
   const peca=id=>BANCADA.st.comps.find(c=>c.id===id);
   VISTA3D.ligada=true;runBuild(LAB3D_BOT,tb());
   bt.em3d=!!document.querySelector('.bench3d canvas');bt.term3d=BANCADA.st.comps.every(c=>D.bornesTERM3D(c)===terms(c).length);
   /* plaquetas: uma por borne, com o nome do 2D, inclinadas para a câmera e com altura legível */
   const todas=['B','DJ','BD','BL','L1'].flatMap(id=>D.plaquetas(id));
   bt.plaquetas=J(D.plaquetas('BL').map(p=>p.t))==='["3","4"]'&&J(D.plaquetas('BD').map(p=>p.t))==='["1","2"]'&&todas.length===10&&todas.every(p=>p.incl<0&&p.alt>=1);
   bt.nomes2D=['B','DJ','L1','BL'].every(id=>{const c=peca(id);return terms(c).every((_,k)=>D.nomeBorne(id,k)===REAL_TERMS[c.type][k].n)});
   cor('fase');toque('B.0');toque('DJ.0');toque('DJ.1');toque('BD.0');toque('BD.1');toque('BL.0');
   /* arraste de BL.1 até L1.0: o badge acompanha o dedo com origem → alvo e some ao soltar */
   {const p=D.tela('BL.1'),q=D.tela('L1.0');pe('pointerdown',p,cv());bt.badgeToque=D.badge();
    pe('pointermove',{x:(p.x+q.x)/2,y:(p.y+q.y)/2+20});pe('pointermove',q);bt.badgeArraste=D.badge();pe('pointerup',q);bt.badgeSoltou=D.badge()}
   cor('neutro');toque('L1.1');toque('B.1');
   bt.apagada=D.brilho('L1')<0.05&&D.emboloAlvo('BL')===0;
   toque('BL');bt.apertouBL=peca('BL').pressed===true&&D.brilho('L1')>0.5&&D.emboloAlvo('BL')<-0.2;
   await espera(800);bt.soltouBL=peca('BL').pressed===false&&D.brilho('L1')<0.05&&D.emboloAlvo('BL')===0;
   toque('BL');toque('BD');bt.bdCorta=peca('BL').pressed===true&&peca('BD').pressed===true&&D.emboloAlvo('BD')<-0.2&&D.brilho('L1')<0.05;
   await espera(800);bt.soltaram=peca('BL').pressed===false&&peca('BD').pressed===false;
   bt.aprovou3d=/aprovado/i.test(verificar());const s3=sig(BANCADA.st);
   VISTA3D.ligada=false;runBuild(LAB3D_BOT,tb());
   const tap=t=>{svg().querySelector('[data-t="'+t+'"]').dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));window.dispatchEvent(new PointerEvent('pointerup'))};
   const aciona=id=>svg().querySelector('[data-sw="'+id+'"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));
   cor('fase');tap('B.0');tap('DJ.0');tap('DJ.1');tap('BD.0');tap('BD.1');tap('BL.0');tap('BL.1');tap('L1.0');cor('neutro');tap('L1.1');tap('B.1');
   aciona('BL');bt.svgApertou=peca('BL').pressed===true;await espera(800);aciona('BL');aciona('BD');await espera(800);
   bt.aprovouSvg=/aprovado/i.test(verificar());bt.equivalente=s3===sig(BANCADA.st);bt.s3=s3;bt.ss=sig(BANCADA.st);}
  /* ---- Botão 3D sem ?3d=1 e modo 360° (Quadro Novo, nível Leve) ---- */
  {const v=R.v360={};S.mode='leve';const pq=phaseById('quadronovo');VISTA3D.flag=false;VISTA3D.ligada=false;
   runBuild(pq,comARede(pq.dados.leve));const b=document.querySelector('[data-3d="1"]');v.botaoSemFlag=!!b&&!!document.querySelector('.bench svg');
   b.click();v.abriu=!!document.querySelector('.bench3d canvas');
   const b3=D.botao360();b3.click();v.livre=D.livre()&&D.azimute()[0]===-Infinity&&/Montar/.test(b3.textContent);
   const antes=BANCADA.st.wires.length;toque('B.0');toque('DG.0');v.naoMexe=BANCADA.st.wires.length===antes&&!D.badge().visivel;
   b3.click();v.voltou=!D.livre()&&D.azimute()[0]===-.65&&D.azimute()[1]===.65;
   toque('B.0');toque('DG.0');v.montaDeNovo=BANCADA.st.wires.length===antes+1;VISTA3D.flag=true;}
  /* ---- Contatora e relé térmico: comando com selo (lâmpada no lugar do motor) ---- */
  {S.mode='moderado';const k=R.contatora={},tk=()=>comARede(LAB3D_KC.dados.moderado),espera=ms=>new Promise(r=>setTimeout(r,ms));
   const peca=id=>BANCADA.st.comps.find(c=>c.id===id);
   const sig=st=>J({fios:st.wires.map(w=>w.a+'-'+w.b+':'+w.cor),k:!!st.comps.find(c=>c.id==='K').on,ft:!!st.comps.find(c=>c.id==='FT').trip,bot:st.comps.filter(c=>c.type==='btn').map(c=>!!c.pressed)});
   const FIOS=[['fase','B.0','DJ.0'],['fase','DJ.1','K.2'],['fase','K.3','FT.0'],['fase','FT.1','L1.0'],['fase','DJ.1','FT.2'],['fase','FT.3','BD.0'],['fase','BD.1','BL.0'],['fase','BL.1','K.0'],['fase','BD.1','K.4'],['fase','K.5','K.0'],['neutro','K.1','B.1'],['neutro','L1.1','B.1']];
   VISTA3D.ligada=true;runBuild(LAB3D_KC,tk());
   k.em3d=!!document.querySelector('.bench3d canvas');k.term3d=BANCADA.st.comps.every(c=>D.bornesTERM3D(c)===terms(c).length);
   k.plaquetas=J(D.plaquetas('K').map(p=>p.t))==='["A1","A2","1","2","13","14"]'&&J(D.plaquetas('FT').map(p=>p.t))==='["1","2","95","96"]';
   let corAtual='';FIOS.forEach(([c,a,b])=>{if(c!==corAtual){cor(c);corAtual=c}toque(a);toque(b)});
   k.fios=BANCADA.st.wires.length===12&&D.brilho('L1')<0.05&&!D.emboloKC('K').on;
   toque('BL');k.liga=peca('K').on===true&&D.brilho('L1')>0.5&&D.emboloKC('K').on&&D.emboloKC('K').cor==='f97316';
   await espera(800);k.selo=peca('K').on===true&&D.brilho('L1')>0.5;
   toque('BD');k.desliga=peca('K').on===false&&D.brilho('L1')<0.05&&!D.emboloKC('K').on;await espera(800);
   toque('BL');await espera(800);toque('FT');k.termico=peca('FT').trip===true&&peca('K').on===false&&D.brilho('L1')<0.05&&D.visorFT('FT')==='disparado';
   toque('FT');k.rearme=peca('FT').trip===false&&D.visorFT('FT')==='armado'&&peca('K').on===false;
   k.aprovou3d=/aprovado/i.test(verificar());const s3=sig(BANCADA.st);
   VISTA3D.ligada=false;runBuild(LAB3D_KC,tk());

   const aciona=id=>svg().querySelector('[data-sw="'+id+'"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));
   corAtual='';FIOS.forEach(([c,a,b])=>{if(c!==corAtual){cor(c);corAtual=c}tap(a);tap(b)});
   aciona('BL');await espera(800);aciona('BD');await espera(800);aciona('BL');await espera(800);aciona('FT');aciona('FT');
   k.aprovouSvg=/aprovado/i.test(verificar());k.equivalente=s3===sig(BANCADA.st);k.s3=s3;k.ss=sig(BANCADA.st);}
  /* ---- Interruptor simples: Primeiro Circuito (Cap. 2, nível Técnico) e Série ou Paralelo nos 3 níveis ---- */
  {const s=R.interruptor={};S.mode='moderado';const pp=phaseById('primeiro'),tp=()=>comARede(pp.dados.moderado),peca=id=>BANCADA.st.comps.find(c=>c.id===id);
   const sig=st=>J({fios:st.wires.map(w=>w.a+'-'+w.b+':'+w.cor),s1:!!st.comps.find(c=>c.id==='S1').closed,dj:!!st.comps.find(c=>c.id==='F').trip});

   let ca='';FIOS.forEach(([c,a,b])=>{if(c!==ca){cor(c);ca=c}toque(a);toque(b)});

   toque('S1');s.desliga=peca('S1').closed===false&&D.brilho('L1')<0.05&&D.tecla('S1')>0;
   s.aprovou3d=/aprovado/i.test(verificar());const s3=sig(BANCADA.st);
   VISTA3D.ligada=false;runBuild(pp,tp());
   const tap=t=>{svg().querySelector('[data-t="'+t+'"]').dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));window.dispatchEvent(new PointerEvent('pointerup'))};
   const aciona=id=>svg().querySelector('[data-sw="'+id+'"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));

   VISTA3D.ligada=true;const pl=phaseById('paralelo');s.paralelo=['leve','moderado','full'].map(md=>{S.mode=md;S.seen[md+':paralelo:cena']=1;runBuild(pl,comARede(pl.dados[md]));return !!document.querySelector('.bench3d canvas')}).every(Boolean);S.mode='moderado';}
  /* sair da bancada libera o WebGL */
  showMap();await new Promise(r=>setTimeout(r,0));R.liberou=VISTA3D.no===null;
}catch(e){R.ERRO=e.message+' '+(e.stack||'')}
document.getElementById('out').textContent=JSON.stringify(R);
})();
