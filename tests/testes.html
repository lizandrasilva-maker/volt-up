<script>
/* Testes das fases: gabaritos, erros comuns, previsões, quizzes, cenas e trava de capítulos.
   Rode com: node tests/rodar.js */
const R={};S.char='aprendiz';S.name='Teste';
const W2=(l)=>l.map(([a,b,cor])=>Object.assign(W(a,b),{cor}));
/* bancada CC (pilhas) confere só pela missão; a rede de 220 V também pela norma e pelas cores */
const verifica=(pid,md,wires)=>{S.mode=md;const p=phaseById(pid),t=p.dados[md];const st={comps:clone(t.comps),wires};return (p.cc?t.check(st,1):t.check(st)||normCheck(st)||colorCheck(st))||'OK'};
try{
  // 1) todos os gabaritos de bancada passam, em todos os níveis
  const g={};for(const p of PHASES.filter(p=>p.tipo==='build'))for(const md of ['leve','moderado','full']){S.mode=md;const sol=testeSol(p.id);g[p.id+':'+md]=sol?verifica(p.id,md,sol):'SEM GABARITO'}
  R.gabaritos=g;
  // 2) erros comuns são pegos (escada_retornoTrocado funciona de verdade: o three-way é simétrico)
  const sem=(pid,md,tira)=>{S.mode=md;const s=testeSol(pid).filter(w=>!tira(w));return verifica(pid,md,s)};
  R.erros={
    quadro_neutroPorFora:(()=>{S.mode='moderado';const s=testeSol('quadronovo').map(w=>w.b==='DR.3'?Object.assign(W(w.a,'B.1'),{cor:'neutro'}):w);return verifica('quadronovo','moderado',s)})(),
    quadro_semDR:(()=>{S.mode='leve';return verifica('quadronovo','leve',W2([['B.0','DG.0','fase'],['DG.1','L1.0','fase'],['L1.1','B.1','neutro']]))})(),
    escada_retornoTrocado:(()=>{S.mode='leve';return verifica('escada','leve',W2([['B.0','SP1.0','fase'],['SP1.1','SP2.2','retorno'],['SP1.2','SP2.1','retorno'],['SP2.0','L1.0','retorno'],['L1.1','B.1','neutro']]))})(),
    escada_neutroNoComando:(()=>{S.mode='leve';return verifica('escada','leve',W2([['B.1','SP1.0','neutro'],['SP1.1','SP2.1','retorno'],['SP1.2','SP2.2','retorno'],['SP2.0','L1.0','retorno'],['L1.1','B.0','fase']]))})(),
    corredor_semIntermediario:(()=>{S.mode='leve';return verifica('corredor','leve',W2([['B.0','SP1.0','fase'],['SP1.1','SP2.1','retorno'],['SP1.2','SP2.2','retorno'],['SP2.0','L1.0','retorno'],['L1.1','B.1','neutro']]))})(),
    garagem_semNeutro:sem('garagem','leve',w=>w.b==='FC.1'),
    impulso_semRele:(()=>{S.mode='leve';return verifica('impulso','leve',W2([['B.0','P1.0','fase'],['P1.1','L1.0','retorno'],['L1.1','B.1','neutro']]))})(),
    partida_semSelo:sem('partida','moderado',w=>w.a==='BD.1'&&w.b==='K.4'),
    partida_semPEmotor:sem('partida','moderado',w=>w.a==='M.2'),
    partida_95_96_fora:(()=>{S.mode='moderado';const s=testeSol('partida').filter(w=>!(w.a==='B.0'&&w.b==='FT.2')&&!(w.a==='FT.3'));s.push(Object.assign(W('B.0','BD.0'),{cor:'fase'}));return verifica('partida','moderado',s)})(),
    caixa_boiaNoNeutro:(()=>{S.mode='leve';return verifica('caixa','leve',W2([['B.0','M.0','fase'],['M.1','BO.0','neutro'],['BO.1','B.1','neutro'],['M.2','BEP.1','terra'],['BEP.0','H.0','terra']]))})()
  };
  // 3) previsões: a resposta certa (opção 0) bate com o que acontece
  const pv={};for(const md of ['leve','moderado','full']){S.mode=md;phaseById('sobrecarga').dados[md].forEach((it,i)=>{const st=it.sc(),antes=solve(st.comps,st.wires).lamp.M>0.04;it.act(st);const depois=solve(st.comps,st.wires).lamp.M>0.04;pv[md+':'+i]=(antes?'girando':'parado')+' → '+(depois?'girando':'parado')})}
  R.previsao=pv;
  // 4) quizzes têm 3 perguntas por nível e 3 opções
  const qz={};for(const p of PHASES.filter(p=>p.tipo==='quiz'))for(const md of ['leve','moderado','full']){const l=p.dados[md];qz[p.id+':'+md]=l.length+'q/'+l.map(x=>x.o.length).join('')}
  R.quizzes=qz;
  // 5) pistas que entregam a resposta: a certa (opção 0) não pode ser a mais longa com frequência,
  //    nem as erradas concentrarem palavras absolutas ("qualquer", "nunca"...)
  const abs=/(^|[^\wÀ-ú])(qualquer|sempre|nunca|tudo|todo|toda|todos|todas|só|nada|nenhum)([^\wÀ-ú]|$)/i;
  let n=0,longa=0,absErr=0,absCerta=0;
  for(const p of PHASES.filter(p=>p.tipo==='quiz'))for(const md of ['leve','moderado','full'])for(const x of p.dados[md]){n++;
    const L=x.o.map(t=>t.length);if(L[0]>Math.max(...L.slice(1)))longa++;
    if(abs.test(x.o[0]))absCerta++;if(x.o.slice(1).some(t=>abs.test(t))&&!abs.test(x.o[0]))absErr++}
  // Outras pistas: a certa ser a única que repete palavra do enunciado ("eco"), a única que traz justificativa
  // (dois-pontos ou "porque"), ou, nas numéricas, ser sempre o valor do meio.
  const PARE=new Set('para pela pelo pelos pelas como mais menos quando onde qual quais porque esta este isso essa esse cada outro outra mesmo mesma muito entre depois antes ainda sobre também apenas seja ser está estão fica ficar pode deve tem têm uma umas uns dos das nos nas com sem que não sim'.split(' '));
  const pal=t=>new Set((t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').match(/[a-z0-9]{4,}/g)||[]).filter(w=>!PARE.has(w)));
  const ESC={k:1e3,M:1e6,m:1e-3,'µ':1e-6};
  const num=t=>{const m=t.replace(/^[≈~]\s*/,'').replace(/^R\$\s*/,'').match(/^(-?\d+(?:[.,]\d+)?)\s*([kMmµ]?)[A-Za-zΩ%]/);return m?parseFloat(m[1].replace(',','.'))*(ESC[m[2]]||1):null};
  let eco=0,justif=0,numQ=0,meio=0;
  for(const p of PHASES.filter(p=>p.tipo==='quiz'))for(const md of ['leve','moderado','full'])for(const x of p.dados[md]){
    const S=pal(x.q),ov=x.o.map(o=>[...pal(o)].filter(w=>S.has(w)).length);if(ov[0]>ov[1]&&ov[0]>ov[2])eco++;
    const J=x.o.map(o=>/:|porque/i.test(o));if(J[0]&&!J[1]&&!J[2])justif++;
    const v=x.o.map(num);if(v.every(z=>z!==null)){numQ++;const s=[...v].sort((a,b)=>a-b);if(s[1]===v[0])meio++}}
  R.pistas={perguntas:n,certaMaisLonga:longa,absolutaSoNasErradas:absErr,absolutaNaCerta:absCerta,ecoDoEnunciado:eco,soCertaJustifica:justif,numericas:numQ,certaNoMeio:meio};
  // 6) cenas e personagens existem
  const falta=[];CHAPTERS.filter(c=>!c.soon).forEach(c=>{[...(c.intro||[]),...(c.fim||[])].forEach(([w])=>{if(w!=='eu'&&!NPC[w])falta.push(c.id+':'+w)});c.fases.forEach(id=>{if(!phaseById(id))falta.push('fase '+id);todasFalas(id).forEach(([w])=>{if(w!=='eu'&&!NPC[w])falta.push(id+':'+w)});if(!ICONS[phaseById(id).ic])falta.push('icone '+id)})});
  R.faltando=falta;
  // 6a) fonte e aterramento
  {const F=n=>Object.assign(BAT(),{fases:n}),fo={};
    fo.bornes1F=terms(F(1)).length+' bornes';fo.bornes3F=terms(F(3)).length+' bornes';
    const lamp=(a,b,n)=>solve([F(n),C('L1','lamp',200,120,0)],[W(a,'L1.0'),W('L1.1',b)]);
    fo.lampadaFN=lit(lamp('B.0','B.1',1),'L1');fo.lampadaEntreFases=lit(lamp('B.0','B.2',3),'L1');
    const r3=solve([F(3)],[]);fo.medeFN=Math.round(r3.vDiff('B.0','B.1'));fo.medeFF=Math.round(r3.vDiff('B.0','B.2'));
    fo.curtoFaseHaste=solve([F(1),C('H','haste',100,205,0)],[W('B.0','H.0')]).short;
    S.mode='moderado';
    const motor=extra=>{const st={comps:[F(1),C('M','motor',250,170,0),...ATERRA()],wires:W2([['B.0','M.0','fase'],['M.1','B.1','neutro']].concat(extra))};return normCheck(st)||colorCheck(st)||'OK'};
    fo.bepSemHaste=motor([['M.2','BEP.1','terra']]);
    fo.motorDiretoNaHaste=motor([['M.2','H.0','terra']]);
    fo.neutroNoBEP=motor([['M.2','BEP.1','terra'],['BEP.0','H.0','terra'],['B.1','BEP.2','terra']]);
    /* DR com uma carga da saída dele para a massa aterrada: só há fuga se a massa estiver na haste */
    const dr=comHaste=>{const comps=[F(1),C('DR','dr',150,60,0),C('L1','lamp',250,170,0),...ATERRA()];
      const w=[W('B.0','DR.0'),W('B.1','DR.1'),W('DR.2','L1.0'),W('L1.1','BEP.1')];if(comHaste)w.push(W('BEP.0','H.0'));solve(comps,w);return !!comps[1].trip};
    fo.drComHaste=dr(true);fo.drSemHaste=dr(false);
    /* Oficina: fonte 3F com fio em L3; ao voltar para 1 fase, o fio do L3 sai */
    S.mode='leve';S.vista={leve:'simb'};S.sandbox={comps:[F(3),C('L1','lamp',200,120,0)],wires:[W('B.3','L1.0'),W('L1.1','B.1')]};runSandbox();
    const mv=document.querySelector('[data-mv="B"]');mv.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));window.dispatchEvent(new PointerEvent('pointerup'));
    const f1=document.querySelector('[data-ac="f1"]');if(f1)f1.click();fo.oficinaTiraFio=!!f1&&S.sandbox.wires.length===1&&nFases(S.sandbox.comps[0])===1;
    R.fonte=fo;}
  // 6b) menu do usuário e privacidade
  S.mode='leve';S.char='aprendiz';S.chap='cap1';S.seen['leve:cap1:intro']=1;
  showHome();R.menu={cards:[...document.querySelectorAll('.menu .mcard')].map(b=>b.id),calcAbre:(()=>{document.getElementById('mCalc').click();const ok=!!document.querySelector('.caderno');showHome();return ok})(),
    politica:!!document.querySelector('a[href="politica-privacidade.html"]')};
  document.getElementById('mHist').click();R.menu.mapaTemVoltar=!!document.getElementById('toMenu')&&!document.querySelector('.mais');
  document.getElementById('toMenu').click();document.getElementById('mPerfil').click();R.menu.perfilMelhorar=document.querySelectorAll('.melhorar .miss').length;
  document.getElementById('bk').click();document.getElementById('mConq').click();R.menu.conquistas=document.querySelectorAll('.achs .ach').length;
  document.getElementById('bk').click();document.getElementById('mPlano').click();R.menu.planoSemConta=document.querySelector('.valid b').textContent;
  window.CONTA={papel:'validador'};R.menu.planoValidador=planoResumo().t;window.CONTA=null;
  document.getElementById('bk').click();document.getElementById('mConfig').click();R.menu.configPolitica=!!document.querySelector('a[href="politica-privacidade.html"]');
  document.getElementById('bk').click();R.menu.voltouAoMenu=!!document.querySelector('.menu');
  S.char=null;abrirInicio();R.menu.semPersonagem=!!document.querySelector('.chars');S.char='aprendiz';
  // 7) trava de capítulos
  S.mode='leve';S.chap='cap2';S.seen={};S.done={};showMap();R.cap2_semCap1=document.querySelector('.soonbox .eyebrow').textContent;
  CHAPTERS[0].fases.forEach(id=>S.done['leve:'+id]=3);S.seen['leve:cap2:intro']=1;showMap();R.cap2_comCap1=document.querySelectorAll('.node').length+' fases';
  S.chap='cap3';showMap();R.cap3_semCap2=document.querySelector('.soonbox .eyebrow').textContent;
  // 7b) cálculo com valores reais: resultados conferidos com contas feitas à mão
  {const c={};const q=(v,e,tol)=>v!==null&&v!==undefined&&Math.abs(v-e)<=(tol||1e-9);
    c.chuveiro=q(CALC.corrente(5500,220).I,25);
    c.potencia=q(CALC.potencia(220,10).P,2200);
    c.resistencia=q(CALC.resistencia(220,25).R,8.8,1e-9);
    const qd=CALC.queda(10,30,4,220);c.quedaV=Math.round(qd.dv*100)/100;c.quedaOk=qd.ok;
    const ql=CALC.queda(20,40,1.5,127);c.quedaLonga=Math.round(ql.pct*10)/10;c.quedaLongaOk=ql.ok;
    const cs=CALC.consumo(5500,0.5,30,0.85);c.kwh=cs.kwh;c.custo=Math.round(cs.custo*100)/100;
    const d1=CALC.disjuntor(18,24),d2=CALC.disjuntor(25,24),d3=CALC.disjuntor(70);c.dj=[d1.In,d1.ok,d2.In,d2.ok,d3.In];
    c.invalidos=[CALC.corrente(5500,0),CALC.queda(10,30,0,220),CALC.consumo(100,30,1)].every(x=>x===null);
    /* tela: a queda aparece na folha e muda quando o aluno digita */
    S.mode='leve';showCalc('queda');c.telaQueda=(document.querySelector('.cres b')||{}).textContent;
    const inp=document.querySelector('input[data-k="I"]');inp.value='20';inp.dispatchEvent(new Event('input'));c.telaQueda20=(document.querySelector('.cres b')||{}).textContent;
    c.aviso=/não substitui projeto nem ART/.test(document.querySelector('.caviso').textContent);
    CALC_VAL.I=10;R.calc=c;}
  // 8) céu por capítulo: o mapa e a fase usam o céu do capítulo certo
  R.ceu=[];S.chap='cap2';showMap();R.ceu.push(document.body.dataset.cap);S.chap='cap1';showMap();R.ceu.push(document.body.dataset.cap);
  S.seen['leve:partida:cena']=1;playPhase(PHASES.findIndex(p=>p.id==='partida'));R.ceu.push(document.body.dataset.cap);
  // 8b) curto real: a proteção desarma, o disjuntor certo cai, religa no toque e a bancada desenha a faísca
  {const cu={};S.mode='leve';
    const prim=fios=>({comps:clone(phaseById('primeiro').dados.leve.comps),wires:fios});
    let st=prim([W('B.0','B.1')]);let ev=protegeCurto(st,'B.1');
    cu.fonte=!!(ev&&ev.fonte&&ev.quem==='B'&&st.comps[0].trip);cu.desligada=solve(st.comps,st.wires).desligada===true;
    acionarPeca(st.comps[0],0);cu.religa=!st.comps[0].trip;cu.desarmaDeNovo=!!protegeCurto(st);
    cu.jumper=protegeCurto(prim([W('B.0','L1.0'),W('L1.0','L1.1')]))===null;   /* fase nos dois bornes, sem neutro: não é curto */
    cu.normal=protegeCurto(prim([W('B.0','L1.0'),W('L1.1','B.1')]))===null;
    S.mode='moderado';const q={comps:clone(phaseById('quadronovo').dados.moderado.comps),wires:testeSol('quadronovo').concat([W('L1.0','L1.1')])};
    ev=protegeCurto(q,'L1.1');cu.seletivo=ev&&ev.quem;cu.l2acesa=solve(q.comps,q.wires).lamp.L2>0.04;cu.fios=ev?ev.fios.length:0;
    const svg=board(q,{real:true,curto:ev});cu.desenho=/class="faisca"/.test(svg)&&/class="wcurto"/.test(svg)&&/^<svg[^>]*class="curto/.test(svg);
    const svg2=board(q,{curto:ev});cu.desenhoDiagrama=/class="faisca"/.test(svg2)&&/class="wcurto"/.test(svg2);
    cu.msg=/Curto-circuito/.test(msgCurto(ev));

    S.mode='moderado';const dj={comps:clone(phaseById('primeiro').dados.moderado.comps),wires:testeSol('primeiro')};
    const F=dj.comps.find(c=>c.type==='fuse'),S1=dj.comps.find(c=>c.id==='S1');S1.closed=true;

    const z0=zb('-').disabled;zb('+').click();const z1=!zb('-').disabled&&vbx()!=='0 0 340 250';zb('-').click();
    cu.zoom=z0&&z1&&vbx()==='0 0 340 250'&&zb('-').disabled;
    R.curto=cu;}
  // 8d) Pilha e Lanterna: simulador CC com valores conferidos à mão (pilha 1,5 V e r = 0,2 Ω; lâmpada 10 Ω)
  {const k={};const pc=(n,sw)=>pecasLanterna(n,sw);
    const W2c=l=>l.map(([a,b])=>W(a,b));

    const inv=W2c([['P1.0','L1.0'],['L1.1','P2.0'],['P1.1','P2.1']]);                                         /* P2 ao contrário */
    k.invertida=[CC.resolver(pc(2,false),inv).eventos.includes('aberto'),CC.pilhaInvertida(pc(2,false),inv)];
    const r3=CC.resolver(pc(3,true),W2c([['P1.0','L1.0'],['L1.1','P3.1'],['P1.1','P2.0'],['P2.1','P3.0']]));   /* 4,5 V: queima */
    k.tres=[Math.round(r3.lampadas.L1.V*100)/100,r3.eventos.includes('queima')];
    const rc=CC.resolver(pc(2,false),W2c([['P1.0','P1.1']]));k.curto=[rc.eventos.includes('curto'),Math.round(rc.pilhas.P1.I*10)/10];

    const stInv={comps:pc(2,false),wires:inv};S.mode='leve';const l1=lanternaCheck(stInv,1),l3=lanternaCheck(stInv,3);S.mode='full';const f3=lanternaCheck(stInv,3);

    /* bancada CC sem a faixa do poste, com valores na tela no Técnico */
    S.mode='moderado';const pl=phaseById('lanterna');runBuild(pl,pl.dados.moderado);

    k.ordemCap1=CHAPTERS[0].fases.join(',');R.cc=k;}
  // 8c) Caça-Defeito com multímetro e ponteiras: sem letras nos parafusos; arrastar a vermelha, tocar para a preta, o visor mede
