<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Teste de desenho do Volt Up</title></head>
<body><div id="app"></div><pre id="out">rodando</pre>
<script>try{localStorage.clear();sessionStorage.clear()}catch(e){}</script>
<script src="../js/estado.js"></script><script src="../js/rede.js"></script><script src="../js/motor.js"></script><script src="../js/bancada-real.js"></script><script src="../js/multifilar.js"></script><script src="../js/planta.js"></script><script src="../js/conteudo.js"></script><script src="../js/cc.js"></script><script src="../js/lanterna.js"></script><script src="../js/cap1.js"></script><script src="../js/imagens.js"></script><script src="../js/historia.js"></script><script src="../js/telas.js"></script><script src="../js/fases.js"></script><script src="../js/aula.js"></script><script src="../js/carreira.js"></script><script src="../js/calculo.js"></script><script src="../js/calculadora.js"></script><script src="../js/teste.js"></script>
<script>
/* Todas as fases de bancada desenham bornes, nas vistas real e simbólica e nos três níveis.
   Rode com: node tests/rodar.js */
const R={};S.char='aprendiz';
for(const v of ['real','simb'])for(const md of ['leve','moderado','full']){S.mode=md;S.vista={[md]:v};
 for(const p of PHASES.filter(p=>p.tipo==='build'||p.tipo==='predict'||p.tipo==='diag')){try{S.seen[md+':'+p.id+':cena']=1;playPhase(PHASES.indexOf(p));const n=document.querySelectorAll('.bench svg .term').length;
   /* toda bancada precisa do aviso do modelo: qualitativo (rede 220 V) ou com as premissas dos valores calculados (pilhas) */
   const av=document.querySelector('.benchwrap .modelo summary');
   R[v+':'+md+':'+p.id]=n===0?'vazio':!av||!(p.cc?/valores calculados/i:/qualitativo/i).test(av.textContent)?'sem aviso de modelo didático':'ok'}catch(e){R[v+':'+md+':'+p.id]='ERRO '+e.message}}}
/* Oficina com todas as peças, fonte de 3 fases, haste e BEP: 3 bornes de fase + N, 1 da haste e 4 do BEP */
const todas=()=>({comps:[Object.assign(BAT(),{fases:3}),C('A','sw2',110,60,0),C('Bq','sw4',180,60,0),C('Cc','dr',250,60,0),C('D','dps',300,60,0),C('E','foto',110,165,0),C('F','ri',180,165,0),C('G','kc',250,165,0),C('Hf','ft',300,165,0),C('I','btn',150,112,0,{nf:true}),C('J','motor',230,112,0),C('K','boia',300,112,0),C('BEP1','bep',45,192,0),C('H1','haste',100,205,0)],wires:[]});
const esperado=todas().comps.reduce((n,c)=>n+terms(c).length,0);
const oficina=v=>{S.vista={leve:v};S.mode='leve';S.sandbox=todas();runSandbox();const n=document.querySelectorAll('.bench svg .term').length;
  return n+' bornes'+(n===esperado?'':' (esperado '+esperado+')')+(document.querySelector('.benchwrap .modelo')?'':' (sem aviso de modelo didático)')};
try{R.oficinaTodas=oficina('simb');R.oficinaReal=oficina('real')}catch(e){R.oficinaTodas='ERRO '+e.message}
const ruins=Object.entries(R).filter(([k,v])=>v!=='ok'&&!k.startsWith('oficina'));
document.getElementById('out').textContent=JSON.stringify({total:Object.keys(R).length,problemas:ruins,oficina:R.oficinaTodas,oficinaReal:R.oficinaReal});
</script></body></html>
