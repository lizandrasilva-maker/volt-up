name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # O runner do GitHub já vem com o Google Chrome instalado.
      - name: Rodar os testes do jogo
        run: node tests/rodar.js
